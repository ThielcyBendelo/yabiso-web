version: '3.9'

services:
  # ==================== BASES DE DONNÉES ====================
  
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: yabiso-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SQLSERVER_ADMIN_PASSWORD:-YaBiso@Secure2026!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./backend/scripts/init-sqlserver.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - yabiso-network
    healthcheck:
      test: 
        - "CMD"
        - "/opt/mssql-tools/bin/sqlcmd"
        - "-S"
        - "localhost"
        - "-U"
        - "sa"
        - "-P"
        - "${SQLSERVER_ADMIN_PASSWORD:-YaBiso@Secure2026!}"
        - "-Q"
        - "SELECT 1"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.0-alpine
    container_name: yabiso-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-YaBiso@MySQL2026!}"
      MYSQL_DATABASE: "yabiso_transactional"
      MYSQL_USER: "${MYSQL_USER:-yabiso_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-YaBiso@Pass2026!}"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/init-mysql.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - yabiso-network
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --default-time-zone='+00:00'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-YaBiso@MySQL2026!}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:7.0-alpine
    container_name: yabiso-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGODB_USER:-yabiso_admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD:-YaBiso@Mongo2026!}"
      MONGO_INITDB_DATABASE: "yabiso_documents"
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backend/scripts/init-mongodb.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - yabiso-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== CACHE & QUEUE ====================

  redis:
    image: redis:7-alpine
    container_name: yabiso-redis
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-YaBiso@Redis2026!}"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yabiso-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: yabiso-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-yabiso}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-YaBiso@RabbitMQ2026!}"
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - yabiso-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==================== MICROSERVICES ====================

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: yabiso-api-gateway
    environment:
      DATABASE_URL: "mssql+pyodbc://sa:${SQLSERVER_ADMIN_PASSWORD:-YaBiso@Secure2026!}@sqlserver:1433/yabiso_auth?driver=ODBC+Driver+17+for+SQL+Server"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-YaBiso@Redis2026!}@redis:6379/0"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-me-in-production-min-32-chars}"
      JWT_ALGORITHM: "HS256"
      DEBUG: "False"
      LOG_LEVEL: "INFO"
      AUTH_SERVICE_URL: "http://auth-service:8000"
      PRODUCTS_SERVICE_URL: "http://products-service:8000"
      PAYMENTS_SERVICE_URL: "http://payments-service:8000"
      ANALYTICS_SERVICE_URL: "http://analytics-service:8000"
    ports:
      - "8000:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yabiso-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: yabiso-auth-service
    environment:
      DATABASE_URL: "mssql+pyodbc://sa:${SQLSERVER_ADMIN_PASSWORD:-YaBiso@Secure2026!}@sqlserver:1433/yabiso_auth?driver=ODBC+Driver+17+for+SQL+Server"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-YaBiso@Redis2026!}@redis:6379/1"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-me-in-production-min-32-chars}"
      JWT_ALGORITHM: "HS256"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/oauth/google/callback}"
      DEBUG: "False"
      LOG_LEVEL: "INFO"
    ports:
      - "8001:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yabiso-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  products-service:
    build:
      context: ./backend/products-service
      dockerfile: Dockerfile
    container_name: yabiso-products-service
    environment:
      MYSQL_URL: "mysql+pymysql://${MYSQL_USER:-yabiso_user}:${MYSQL_PASSWORD:-YaBiso@Pass2026!}@mysql:3306/yabiso_transactional"
      MONGODB_URL: "mongodb://${MONGODB_USER:-yabiso_admin}:${MONGODB_PASSWORD:-YaBiso@Mongo2026!}@mongodb:27017/yabiso_documents"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-YaBiso@Redis2026!}@redis:6379/2"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-me-in-production-min-32-chars}"
      DEBUG: "False"
      LOG_LEVEL: "INFO"
    ports:
      - "8002:8000"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yabiso-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  payments-service:
    build:
      context: ./backend/payments-service
      dockerfile: Dockerfile
    container_name: yabiso-payments-service
    environment:
      MYSQL_URL: "mysql+pymysql://${MYSQL_USER:-yabiso_user}:${MYSQL_PASSWORD:-YaBiso@Pass2026!}@mysql:3306/yabiso_transactional"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-YaBiso@Redis2026!}@redis:6379/3"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-yabiso}:${RABBITMQ_PASSWORD:-YaBiso@RabbitMQ2026!}@rabbitmq:5672/"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-me-in-production-min-32-chars}"
      STRIPE_API_KEY: "${STRIPE_API_KEY:-}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      AIRTEL_API_KEY: "${AIRTEL_API_KEY:-}"
      VODACOM_API_KEY: "${VODACOM_API_KEY:-}"
      ORANGE_API_KEY: "${ORANGE_API_KEY:-}"
      OPENEXCHANGERATES_KEY: "${OPENEXCHANGERATES_KEY:-}"
      DEBUG: "False"
      LOG_LEVEL: "INFO"
    ports:
      - "8003:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - yabiso-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  analytics-service:
    build:
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    container_name: yabiso-analytics-service
    environment:
      MONGODB_URL: "mongodb://${MONGODB_USER:-yabiso_admin}:${MONGODB_PASSWORD:-YaBiso@Mongo2026!}@mongodb:27017/yabiso_analytics"
      MYSQL_URL: "mysql+pymysql://${MYSQL_USER:-yabiso_user}:${MYSQL_PASSWORD:-YaBiso@Pass2026!}@mysql:3306/yabiso_transactional"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-YaBiso@Redis2026!}@redis:6379/4"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-yabiso}:${RABBITMQ_PASSWORD:-YaBiso@RabbitMQ2026!}@rabbitmq:5672/"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-me-in-production-min-32-chars}"
      DEBUG: "False"
      LOG_LEVEL: "INFO"
    ports:
      - "8004:8000"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - yabiso-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ==================== WORKERS ====================

  celery-worker:
    build:
      context: ./backend/shared
      dockerfile: Dockerfile.celery
    container_name: yabiso-celery-worker
    environment:
      CELERY_BROKER_URL: "amqp://${RABBITMQ_USER:-yabiso}:${RABBITMQ_PASSWORD:-YaBiso@RabbitMQ2026!}@rabbitmq:5672/"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-YaBiso@Redis2026!}@redis:6379/5"
      MYSQL_URL: "mysql+pymysql://${MYSQL_USER:-yabiso_user}:${MYSQL_PASSWORD:-YaBiso@Pass2026!}@mysql:3306/yabiso_transactional"
      SENDGRID_API_KEY: "${SENDGRID_API_KEY:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      DEBUG: "False"
      LOG_LEVEL: "INFO"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yabiso-network
    command: celery -A tasks worker -l info -c 4

networks:
  yabiso-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
  mysql_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
