[pytest]
# Pytest configuration pour YaBiso Platform

# Python files
python_files = test_*.py *_test.py tests.py

# Test discovery paths
testpaths = backend/tests

# Minimum Python version
minversion = 7.0

# Add current directory to Python path
pythonpath = . backend

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
    auth: Authentication tests
    products: Product tests
    payments: Payment tests
    analytics: Analytics tests

# Coverage options
addopts =
    --verbose
    --strict-markers
    --disable-warnings
    --cov=backend/shared
    --cov=backend/auth-service
    --cov=backend/products-service
    --cov=backend/payments-service
    --cov=backend/analytics-service
    --cov-report=html
    --cov-report=term-missing:skip-covered
    -v

# Asyncio configuration
asyncio_mode = auto

# Timeout for tests
timeout = 300

# Log level
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
