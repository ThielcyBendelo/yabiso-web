version: '3.9'

services:
  # Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: yabiso-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - yabiso-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: yabiso-api-gateway
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DEBUG: "False"
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AUTH_SERVICE_URL: http://auth-service:8001
      PRODUCTS_SERVICE_URL: http://products-service:8002
      PAYMENTS_SERVICE_URL: http://payments-service:8003
      ANALYTICS_SERVICE_URL: http://analytics-service:8004
      RATE_LIMIT_ENABLED: "True"
      RATE_LIMIT_REQUESTS: 1000
      RATE_LIMIT_WINDOW_SECONDS: 60
      CORS_ORIGINS: https://yourdomain.com,https://www.yourdomain.com
    depends_on:
      auth-service:
        condition: service_healthy
      products-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
    networks:
      - yabiso-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: yabiso-auth-service
    ports:
      - "8001:8001"
    environment:
      APP_ENV: production
      DEBUG: "False"
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8001
      SQLSERVER_URL: ${SQLSERVER_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_HOURS: 24
      JWT_REFRESH_EXPIRE_DAYS: 7
      CORS_ORIGINS: https://yourdomain.com,https://www.yourdomain.com
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - yabiso-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Products Service
  products-service:
    build:
      context: ./products-service
      dockerfile: Dockerfile
    container_name: yabiso-products-service
    ports:
      - "8002:8002"
    environment:
      APP_ENV: production
      DEBUG: "False"
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8002
      MYSQL_URL: ${MYSQL_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: https://yourdomain.com,https://www.yourdomain.com
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - yabiso-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Payments Service
  payments-service:
    build:
      context: ./payments-service
      dockerfile: Dockerfile
    container_name: yabiso-payments-service
    ports:
      - "8003:8003"
    environment:
      APP_ENV: production
      DEBUG: "False"
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8003
      MYSQL_URL: ${MYSQL_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      CORS_ORIGINS: https://yourdomain.com,https://www.yourdomain.com
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - yabiso-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Analytics Service
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: yabiso-analytics-service
    ports:
      - "8004:8004"
    environment:
      APP_ENV: production
      DEBUG: "False"
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8004
      MONGODB_URL: ${MONGODB_URL}
      MONGODB_DB: yabiso_analytics
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: https://yourdomain.com,https://www.yourdomain.com
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - yabiso-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: yabiso-sqlserver
    environment:
      SA_PASSWORD: ${SQLSERVER_PASSWORD}
      ACCEPT_EULA: Y
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./scripts/init-sqlserver.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - yabiso-network
    restart: always
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "SA", "-P", "${SQLSERVER_PASSWORD}", "-Q", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: yabiso-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yabiso_products
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - yabiso-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: yabiso-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: yabiso_analytics
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./scripts/init-mongodb.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - yabiso-network
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: yabiso-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - yabiso-network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: yabiso-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - yabiso-network
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  yabiso-network:
    driver: bridge

volumes:
  sqlserver-data:
  mysql-data:
  mongodb-data:
  redis-data:
  rabbitmq-data:
